# nginx.conf  --  docker-openresty
#
# This file is installed to:
#   `/usr/local/openresty/nginx/conf/nginx.conf`
# and is the file loaded by nginx at startup,
# unless the user specifies otherwise.
#
# It tracks the upstream OpenResty's `nginx.conf`, but removes the `server`
# section and adds this directive:
#     `include /etc/nginx/conf.d/*.conf;`
#
# The `docker-openresty` file `nginx.vh.default.conf` is copied to
# `/etc/nginx/conf.d/default.conf`.  It contains the `server section
# of the upstream `nginx.conf`.
#
# See https://github.com/openresty/docker-openresty/blob/master/README.md#nginx-config-files
#

#user  www-data;
# P1-2.1：与 nginx.conf 同类问题，单 worker 浪费多核；Docker 下不用 auto
worker_processes  2;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/openresty.error.log warn;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    # P1-2.1：原 1024；代理请求占 2 个 fd，实际并发约为一半
    worker_connections  8192;
    multi_accept on;
}


http {
    # P2-3.11：相对路径按 prefix 解析，docker-openresty 的 prefix 是 /usr/local/openresty/nginx，
    # 而 mime.types 实际在 conf/ 下，相对写法会找不到文件；统一改成绝对路径。
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # P2-3.10：删除 $request_body —— 它会把密码、Token、上传内容完整写进访问日志。
    # 同时修正原格式的拼接缺陷（"$http_x_forwarded_for""$request_body" 会粘成一个字段）。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time '
                      'ua=$upstream_addr';

    # P2-3.11：日志统一落到 compose 挂载的 /var/log/nginx（与 error_log 一致）。
    # 原相对路径 logs/access.log 会写进容器内未挂载的目录，宿主机看不到。
    access_log  /var/log/nginx/openresty.access.log  main buffer=32k flush=5s;

    #隐藏版本号
    server_tokens off;
    sendfile        on;
    # P1-2.2：同步主配置
    tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    # P1-2.2：同步主配置的 gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss application/xhtml+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
