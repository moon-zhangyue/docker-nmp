# ============================================================
# 智能客服 Agent 独立访问入口
# 访问: http://<宿主IP>:8099/cs/           (用户聊天端)
#       http://<宿主IP>:8099/cs/admin.html  (管理后台)
# ============================================================
server {
    listen 8099;
    server_name _;
    root  /www/thinkphp8/public;
    index index.php index.html index.htm;

    charset utf-8;
    error_log  /var/log/nginx/nginx.cs.error.log warn;

    # 前端静态页面（精确匹配）
    location = /cs/            { try_files /cs/index.html =404; }
    location = /cs/index.html  { try_files $uri =404; }
    location = /cs/admin.html  { try_files $uri =404; }
    location = /cs/config.js   { try_files $uri =404; }

    # WebSocket 实时推送：同源反代到 cs-ws 容器
    # 浏览器据此建立 ws://<host>:8099/cs/ws，Origin 与 Cookie 天然同源
    location = /cs/ws {
        proxy_pass http://cs-ws:8098;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ThinkPHP 路由（/cs/chat/... /cs/admin/... 等 API）
    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|map)$ {
        expires 1h;
        try_files $uri =404;
    }

    include /etc/nginx/conf.d/php-fcgi.inc;
}
