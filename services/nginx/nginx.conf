
# 指定运行Nginx的用户和用户组
user  nginx;
# 指定Nginx要开启的进程数
# P1-2.1：原为 1，多核机器上其余 CPU 完全闲置。
# Docker 下不要无脑用 auto：nginx 读的是宿主机 CPU 数、不感知 cgroup 配额，
# 12 核开发机会直接拉起 12 个 worker；这里显式给小值，生产用 auto 时请同时给 compose 加 cpus 限制。
worker_processes  2;
# P1-2.1：放宽 fd 上限，否则 worker_connections 开大会被系统限制卡住
worker_rlimit_nofile 65535;

# 指定Nginx运行时的PID文件存放路径
pid        /var/run/nginx.pid;
# 指定Nginx的错误日志存放路径和日志级别
# P2-3.9：调试期用 notice，reload / resolver 类提示不再被 warn 级吞掉；生产可改回 warn
error_log  /var/log/nginx/nginx.error.log notice;

# 定义事件处理相关配置
events {
    # P1-2.1：原 1024。代理请求占 2 个 fd（客户端 + 上游），实际并发约为一半
    worker_connections  8192;
    multi_accept on;
    # use epoll;                # Linux 下 nginx 会自动选，可省略
}


# 定义HTTP服务器相关配置
http {
    # 包含MIME类型定义文件
    include       /etc/nginx/mime.types;
    # 默认的MIME类型
    default_type  application/octet-stream;

    # 定义主要的日志格式
    # P2-3.2 / 3.3：原 main 定义了却从未被使用（所有 access_log 都指向 /dev/null）；
    # 且缺 $request_time / $upstream_*，无法判断慢在 nginx 还是 PHP-FPM，这里一并补齐。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time '
                      'ua=$upstream_addr';

    # P2-3.1：落地真实访问日志（带缓冲，避免每请求 fsync）。
    # 原 access_log /dev/null 仍有 write 调用与日志锁开销，且出问题时完全无法观测。
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    #access_log  /var/log/dnmp/nginx.access.log  main;

    # P2-3.4：隐藏精确版本号（原 server_tokens on；openresty 那份本来就是 off）
    server_tokens  off;
    sendfile        on;
    # P1-2.2：sendfile 下配合 tcp_nopush，攒满一个 TCP 包再发
    tcp_nopush     on;

    # P1-2.8：请求体上限与缓冲/超时
    # 原 100M 与 php 的 post_max_size=100M 恰好卡在边界（multipart 还有额外开销），留出余量
    client_max_body_size    128M;
    client_body_buffer_size 256k;
    client_header_timeout   10s;
    client_body_timeout     30s;
    send_timeout            30s;

    keepalive_timeout  65;

    # P1-2.2：gzip（原为注释）。gzip_types 默认只含 text/html，必须显式列出其他类型
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss application/xhtml+xml image/svg+xml;

    # P1-2.4：TLS 会话复用与协议限制
    # 注意：未加 HSTS —— 本站还有 webman.local / workerman.local / tp8.local 等纯 HTTP 站点，
    # 加 HSTS 会让浏览器强制走 HTTPS，这些站点会直接不可用。
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    # 报告的原始建议是 off，但 TLS1.3 的会话复用只能靠 ticket（没有 session id），
    # off 会让 2.4 的"减少握手"目标在 TLS1.3 下完全失效（实测 -reconnect 全部为 New）。
    # 本地开发保留 on 以真正获得复用；生产若因前向安全/合规要求关闭，需接受 TLS1.3 无复用。
    ssl_session_tickets       on;

    # P2-3.16：限流 zone。此处只定义，不自动套到每个站点；
    # 需要保护的 server/location 内自行加 `limit_req zone=req_per_ip burst=20 nodelay;`
    # 或 `limit_conn conn_per_ip 50;`（目前 XHGui 已启用 limit_req）。
    limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # P1-2.5：文件元数据缓存，减少每个 PHP 请求上 try_files 的 stat 开销
    # 注意：open_file_cache_errors on 会缓存 404 最长 60s，新建文件后可能短暂 404，可调小 valid
    open_file_cache          max=4096 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    include /etc/nginx/conf.d/*.conf;
}
