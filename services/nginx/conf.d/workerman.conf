# Workerman / webman 反向代理
# P0 修复：upstream 必须指向真正提供服务的 php85 容器，而不是 nginx 容器自身的 127.0.0.1；
#          proxy_pass 改为引用 upstream，才能启用 keepalive / 负载均衡 / 故障转移。

# 兼容 WebSocket：客户端带 Upgrade 头时透传 upgrade，否则清空 Connection 以启用 upstream keepalive
# （nginx 对值为空字符串的 proxy_set_header 不会发送该头）
map $http_upgrade $workerman_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream workerman {
    server php85:2345;
    keepalive 32;
}

server {
    # 监听端口
    listen 80;
    # 绑定的域名，填写您的域名
    server_name workerman.local;
    root /www/workerman/;
    index index.php index.html index.htm;

    error_log /var/log/nginx/nginx.workerman.error.log warn;

    location / {
        # keepalive 必需：默认 HTTP/1.0 + Connection: close 会让每请求重建 TCP
        proxy_http_version 1.1;
        proxy_set_header Connection $workerman_connection_upgrade;

        # 将客户端的 Host 和 IP 信息一并转发到对应节点
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 纯 HTTP 站点不能给 Cookie 加 Secure，否则浏览器不会回传，登录态会丢失
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";

        # 执行代理访问真实服务器
        proxy_pass http://workerman;
    }
}

upstream webman {
    server php85:8787;
    keepalive 32;
}

server {
    # 监听端口
    listen 80;
    # 绑定的域名，填写您的域名
    server_name webman.local;
    # 注意，这里一定是webman下的public目录，不能是webman根目录
    root /www/webman/public;
    index index.php index.html index.htm;

    error_log /var/log/nginx/nginx.webman.error.log warn;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection $workerman_connection_upgrade;

        # 将客户端的 Host 和 IP 信息一并转发到对应节点
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 纯 HTTP 站点不能给 Cookie 加 Secure，否则浏览器不会回传，登录态会丢失
        proxy_cookie_path / "/; HttpOnly; SameSite=Lax";

        # 执行代理访问真实服务器
        proxy_pass http://webman;
    }
}
