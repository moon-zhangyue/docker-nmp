<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 · 小智</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --primary: #4f46e5; --primary-light: #eef2ff; --bg: #f5f6fa;
        --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
        --bot: #ffffff; --user: #4f46e5;
    }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; }
    .app { position: relative; width: 420px; height: 760px; max-height: 96vh; background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.12); display: flex; flex-direction: column; overflow: hidden; }
    .header { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .header h1 { font-size: 17px; font-weight: 600; }
    .header p { font-size: 12px; opacity: .85; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; display: inline-block; }
    .header .acts { margin-left: auto; display: flex; gap: 6px; }
    .header .acts button { background: rgba(255,255,255,.18); border: none; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .header .acts button:hover { background: rgba(255,255,255,.3); }
    .msgs { flex: 1; overflow-y: auto; padding: 18px 16px; background: var(--bg); }
    .msg { display: flex; gap: 10px; margin-bottom: 16px; animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px);} to {opacity:1;transform:none;} }
    .msg.user { flex-direction: row-reverse; }
    .msg-body { display: flex; flex-direction: column; align-items: flex-start; max-width: calc(100% - 42px); min-width: 0; }
    .msg.user .msg-body { align-items: flex-end; }
    .bubble { max-width: 100%; padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .msg.bot .bubble, .msg.system .bubble { background: var(--bot); border: 1px solid var(--line); border-top-left-radius: 3px; }
    .msg.user .bubble { background: var(--user); color: #fff; border-top-right-radius: 3px; }
    .msg.system .bubble { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .m-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .msg.bot .m-avatar, .msg.system .m-avatar { background: var(--primary-light); }
    .tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .tag { font-size: 11px; color: var(--primary); background: var(--primary-light); padding: 2px 8px; border-radius: 20px; }
    .tag.src { color: #059669; background: #ecfdf5; }
    .typing { display: inline-flex; gap: 4px; }
    .typing i { width: 6px; height: 6px; background: #9ca3af; border-radius: 50%; animation: blink 1.2s infinite; }
    .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
    @keyframes blink { 0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)} }
    .daydiv { text-align: center; margin: 4px 0 14px; }
    .daydiv span { font-size: 11px; color: var(--muted); background: #e8eaf0; padding: 3px 10px; border-radius: 20px; }
    .quick { padding: 8px 14px; display: flex; gap: 8px; overflow-x: auto; border-top: 1px solid var(--line); }
    .quick button { flex-shrink: 0; border: 1px solid var(--primary); color: var(--primary); background: #fff; padding: 6px 12px; border-radius: 18px; font-size: 12px; cursor: pointer; }
    .quick button:hover { background: var(--primary-light); }
    .rate-box { margin: 0 16px 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: center; display: none; }
    .rate-box.show { display: block; }
    .rate-box p { font-size: 13px; margin-bottom: 8px; color: var(--muted); }
    .stars { font-size: 26px; cursor: pointer; letter-spacing: 4px; }
    .stars span { color: #d1d5db; transition: color .15s; }
    .stars span.on { color: #fbbf24; }
    .stars.readonly { cursor: default; }
    .rate-box button { margin-top: 10px; background: var(--primary); color: #fff; border: none; padding: 6px 20px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .rate-done { color: #059669; font-size: 13px; }
    .rate-done .big { font-size: 20px; color: #fbbf24; letter-spacing: 2px; }
    .rate-done button { margin-left: 10px; background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .input-area { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-end; }
    .input-area textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit; height: 44px; max-height: 100px; outline: none; }
    .input-area textarea:focus { border-color: var(--primary); }
    .send { background: var(--primary); color: #fff; border: none; border-radius: 12px; width: 44px; height: 44px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
    .send:disabled { opacity: .5; cursor: not-allowed; }
    .panel { position: absolute; inset: 0; background: #fff; z-index: 10; display: none; flex-direction: column; }
    .panel.show { display: flex; }
    .panel-hd { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
    .panel-hd h2 { font-size: 16px; font-weight: 600; }
    .panel-hd .close { margin-left: auto; background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
    .sess-list { flex: 1; overflow-y: auto; padding: 12px; }
    .sess { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
    .sess:hover { border-color: var(--primary); background: var(--primary-light); }
    .sess.cur { border-color: var(--primary); background: var(--primary-light); }
    .sess .q { font-size: 13px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sess .meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .sess .badge { padding: 2px 8px; border-radius: 20px; background: #f3f4f6; }
    .sess .badge.rate { background: #fef3c7; color: #92400e; }
    .sess .badge.human { background: #fee2e2; color: #991b1b; }
    .sess .time { margin-left: auto; }
    .empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 13px; line-height: 1.8; }
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="avatar">🤖</div>
        <div>
            <h1>智能客服 · 小智</h1>
            <p><span class="dot"></span> <span id="sessLabel">在线 · 7×24 小时为您服务</span></p>
        </div>
        <div class="acts">
            <button onclick="openHistory()">历史</button>
            <button onclick="newSession()">新会话</button>
        </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick">
        <button onclick="quickSend('如何申请退款？')">💰 申请退款</button>
        <button onclick="quickSend('查询我的订单状态')">📦 查询订单</button>
        <button onclick="quickSend('app闪退打不开')">🛠️ 技术支持</button>
        <button onclick="quickSend('转人工')">👩‍💻 转人工</button>
    </div>
    <div class="rate-box" id="rateBox">
        <p>本次服务您还满意吗？</p>
        <div class="stars" id="stars">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
        </div>
        <button onclick="submitRate()">提交评价</button>
    </div>
    <div class="input-area">
        <textarea id="input" placeholder="输入您的问题，Enter 发送..." onkeydown="onKey(event)"></textarea>
        <button class="send" id="sendBtn" onclick="send()">➤</button>
    </div>

    <!-- 历史会话面板 -->
    <div class="panel" id="historyPanel">
        <div class="panel-hd"><h2>历史会话记录</h2><button class="close" onclick="closeHistory()">×</button></div>
        <div class="sess-list" id="sessList"></div>
    </div>
</div>
<script src="config.js"></script>
<script>
var STORE_KEY = 'cs_session_ids';
var sessionId = '';
var rating = 0;
var busy = false;
var ratedThisSession = false;
var messages = [];

var GREETING = '您好！我是智能客服小智 😊\n我可以帮您处理退款、查询订单、技术支持等问题。请问有什么可以帮您？';

function getIds() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch (e) { return []; }
}
function remember(id) {
    var ids = getIds();
    if (ids.indexOf(id) === -1) { ids.unshift(id); localStorage.setItem(STORE_KEY, JSON.stringify(ids.slice(0, 50))); }
}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

function newSession() {
    csApi('/chat/new', { method: 'POST', body: { user_name: '访客' } }).then(function (r) {
        if (r.code === 0) { remember(r.session_id); loadSession(r.session_id, true); }
    });
}

function loadSession(sid, fresh) {
    sessionId = sid;
    ratedThisSession = false;
    rating = 0;
    resetRateBox();
    document.getElementById('sessLabel').textContent = '会话 ' + sid.slice(-8);
    if (fresh) {
        messages = [];
        renderMessages();
        addMsg('bot', GREETING);
    } else {
        csApi('/chat/history?session_id=' + encodeURIComponent(sid)).then(function (r) {
            if (r.code === 0) {
                messages = r.messages || [];
                renderMessages();
                // 回看时若该会话已有评价，展示已评价状态
                checkRated(sid);
            }
        });
    }
}

function checkRated(sid) {
    csApi('/chat/sessions', { method: 'POST', body: { session_ids: [sid] } }).then(function (r) {
        if (r.code === 0 && r.sessions && r.sessions[0] && r.sessions[0].rating) {
            showRated(r.sessions[0].rating);
        }
    });
}

function renderMessages() {
    var m = document.getElementById('msgs');
    m.innerHTML = '';
    messages.forEach(function (x) {
        var tags = [];
        if (x.source && x.source !== 'user') tags.push({ text: sourceLabel(x.source), cls: 'src' });
        if (x.intent && x.intent !== 'other') tags.push({ text: intentLabel(x.intent), cls: '' });
        addMsg(x.role, x.content, tags, false);
    });
    scrollBottom();
}
function scrollBottom() { var m = document.getElementById('msgs'); m.scrollTop = m.scrollHeight; }
function addMsg(role, content, tags, push) {
    var m = document.getElementById('msgs');
    var div = document.createElement('div');
    var cls = role === 'user' ? 'user' : role === 'system' ? 'system' : 'bot';
    div.className = 'msg ' + cls;
    var avatar = role === 'user' ? '👤' : '🤖';
    var tagHtml = '';
    if (tags && tags.length) {
        tagHtml = '<div class="tags">' + tags.map(function(t){return '<span class="tag '+t.cls+'">'+t.text+'</span>';}).join('') + '</div>';
    }
    div.innerHTML = '<div class="m-avatar">'+avatar+'</div><div class="msg-body"><div class="bubble">'+escapeHtml(content)+'</div>'+tagHtml+'</div>';
    m.appendChild(div);
    var item = { role: role, content: content };
    if (push !== false) { messages.push(item); scrollBottom(); }
}
function showTyping() {
    var m = document.getElementById('msgs');
    var div = document.createElement('div');
    div.className = 'msg bot'; div.id = 'typing';
    div.innerHTML = '<div class="m-avatar">🤖</div><div class="msg-body"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>';
    m.appendChild(div); scrollBottom();
}
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function quickSend(text) { document.getElementById('input').value = text; send(); }
function send() {
    if (busy) return;
    var input = document.getElementById('input');
    var text = input.value.trim();
    if (!text) return;
    if (!sessionId) { setTimeout(send, 200); return; }
    remember(sessionId);
    input.value = ''; busy = true;
    document.getElementById('sendBtn').disabled = true;
    addMsg('user', text);
    showTyping();
    csApi('/chat/send', { method: 'POST', body: { session_id: sessionId, message: text } }).then(function (r) {
        var t = document.getElementById('typing'); if (t) t.remove();
        if (r.code === 0) {
            var tags = [{ text: r.intent_label || '其他', cls: '' }, { text: sourceLabel(r.source), cls: 'src' }];
            addMsg(r.transferred ? 'system' : 'bot', r.reply, tags);
            if (r.transferred && !ratedThisSession) showRate();
        } else {
            addMsg('bot', '抱歉，服务暂时不可用：' + r.msg);
        }
    }).catch(function(){ var t=document.getElementById('typing'); if(t)t.remove(); addMsg('bot','网络异常，请稍后重试。'); })
    .finally(function(){ busy=false; document.getElementById('sendBtn').disabled=false; });
}
function sourceLabel(s){return {faq:'知识库',llm:'AI生成',agent:'人工客服',user:'用户',system:'系统'}[s]||s;}
function intentLabel(i){return {refund:'退款',order_query:'查订单',tech_support:'技术支持',other:'其他'}[i]||i;}

function showRate() { if (!ratedThisSession) document.getElementById('rateBox').classList.add('show'); }
function bindStars() {
    document.querySelectorAll('#stars span').forEach(function (s) {
        s.onclick = function () {
            rating = parseInt(this.dataset.v);
            document.querySelectorAll('#stars span').forEach(function (x){ x.classList.toggle('on', parseInt(x.dataset.v) <= rating); });
        };
    });
}
function resetRateBox() {
    var box = document.getElementById('rateBox');
    box.innerHTML = '<p>本次服务您还满意吗？</p><div class="stars" id="stars">' +
        '<span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>' +
        '</div><button onclick="submitRate()">提交评价</button>';
    bindStars();
    box.classList.remove('show');
}
function showRated(r) {
    var box = document.getElementById('rateBox');
    var stars = '';
    for (var i = 0; i < 5; i++) stars += (i < r ? '★' : '☆');
    box.innerHTML = '<div class="rate-done"><div class="big">' + stars + '</div>已评价 ' + r + ' 星，感谢您的反馈！您可以继续聊天。' +
        '<button onclick="resetRateBox()">重新评价</button></div>';
    box.classList.add('show');
    ratedThisSession = true;
}
function submitRate() {
    if (!rating) { alert('请先选择星级'); return; }
    if (!sessionId) return;
    var r0 = rating;
    csApi('/chat/rate', { method: 'POST', body: { session_id: sessionId, rating: rating, comment: '' } }).then(function(r){
        if (r.code === 0) {
            showRated(r0);
        }
    });
}

function openHistory() {
    closeHistory();
    var ids = getIds();
    var list = document.getElementById('sessList');
    if (!ids.length) {
        list.innerHTML = '<div class="empty">暂无历史会话<br>开始聊天后，记录会自动保存在这里</div>';
    } else {
        list.innerHTML = '<div class="empty">加载中...</div>';
        csApi('/chat/sessions', { method: 'POST', body: { session_ids: ids } }).then(function (r) {
            if (r.code !== 0) { list.innerHTML = '<div class="empty">加载失败</div>'; return; }
            var items = r.sessions || [];
            if (!items.length) { list.innerHTML = '<div class="empty">暂无历史会话</div>'; return; }
            list.innerHTML = items.map(function (s) {
                var q = s.first_question ? escapeHtml(s.first_question) : '（无消息）';
                var badges = '<span class="badge">' + s.status_text + '</span>' +
                    '<span class="badge">' + s.intent_text + '</span>' +
                    '<span class="badge">' + s.msg_count + ' 条</span>';
                if (s.rating) badges += '<span class="badge rate">' + s.rating + ' ★</span>';
                if (s.transferred) badges += '<span class="badge human">已转人工</span>';
                var cur = s.session_id === sessionId ? ' cur' : '';
                return '<div class="sess' + cur + '" onclick="pickSession(\'' + s.session_id + '\')">' +
                    '<div class="q">' + q + '</div><div class="meta">' + badges +
                    '<span class="time">' + (s.updated_at || '').slice(5,16) + '</span></div></div>';
            }).join('');
        });
    }
    document.getElementById('historyPanel').classList.add('show');
}
function closeHistory() { document.getElementById('historyPanel').classList.remove('show'); }
function pickSession(sid) {
    closeHistory();
    loadSession(sid, false);
}

bindStars();
newSession();
</script>
</body>
</html>
