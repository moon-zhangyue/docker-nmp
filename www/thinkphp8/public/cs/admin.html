<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 · 管理后台</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --primary:#4f46e5; --bg:#f3f4f6; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --green:#10b981; --red:#ef4444; --amber:#f59e0b; }
    body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
    .layout { display:flex; min-height:100vh; }
    .sidebar { width:220px; background:#111827; color:#d1d5db; flex-shrink:0; padding:20px 0; position:fixed; height:100vh; }
    .brand { padding:0 22px 20px; font-size:18px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px; border-bottom:1px solid #1f2937; }
    .nav { margin-top:16px; }
    .nav a { display:block; padding:12px 22px; color:#9ca3af; text-decoration:none; cursor:pointer; border-left:3px solid transparent; }
    .nav a:hover { background:#1f2937; color:#fff; }
    .nav a.active { background:#1f2937; color:#fff; border-left-color:var(--primary); }
    .main { margin-left:220px; flex:1; padding:24px 30px; width:calc(100% - 220px); }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
    .topbar h2 { font-size:22px; }
    .topbar .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    .badge { background:#ecfdf5; color:#059669; padding:6px 12px; border-radius:20px; font-size:12px; }
    .page { display:none; }
    .page.active { display:block; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:22px; }
    .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .card .label { color:var(--muted); font-size:13px; }
    .card .value { font-size:30px; font-weight:700; margin:8px 0 4px; }
    .card .hint { font-size:12px; color:var(--muted); }
    .card .icon { float:right; font-size:24px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
    .panel { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .panel h3 { font-size:15px; margin-bottom:18px; }
    .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .bar-row .name { width:70px; font-size:13px; color:var(--muted); }
    .bar-track { flex:1; background:#f3f4f6; border-radius:6px; height:22px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:6px; background:linear-gradient(90deg,#6366f1,#8b5cf6); display:flex; align-items:center; justify-content:flex-end; padding-right:8px; color:#fff; font-size:11px; transition:width .5s; min-width:22px; }
    .stars-dist { display:flex; align-items:flex-end; gap:14px; height:150px; }
    .star-col { flex:1; text-align:center; }
    .star-bar { background:linear-gradient(180deg,#fbbf24,#f59e0b); border-radius:6px 6px 0 0; margin:0 auto 6px; width:60%; min-height:2px; transition:height .5s; }
    .star-col .lbl { font-size:12px; color:var(--muted); }
    .spark { display:flex; align-items:flex-end; gap:6px; height:150px; }
    .spark .col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .spark .b { width:70%; background:linear-gradient(180deg,#6366f1,#4f46e5); border-radius:4px 4px 0 0; min-height:2px; transition:height .5s; }
    .spark .d { font-size:10px; color:var(--muted); }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); font-size:13px; }
    th { color:var(--muted); font-weight:500; background:#f9fafb; }
    tr:hover td { background:#f9fafb; }
    .status { padding:3px 10px; border-radius:20px; font-size:12px; }
    .s1{background:#dbeafe;color:#1d4ed8}.s2{background:#fef3c7;color:#b45309}.s3{background:#d1fae5;color:#047857}
    .intent-tag{background:#eef2ff;color:#4f46e5;padding:3px 9px;border-radius:20px;font-size:12px}
    .link { color:var(--primary); cursor:pointer; }
    .toolbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .toolbar input, .toolbar select { padding:8px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; outline:none; }
    .toolbar button { padding:8px 16px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; }
    .pager { display:flex; gap:8px; align-items:center; margin-top:16px; justify-content:flex-end; font-size:13px; color:var(--muted); }
    .pager button { padding:5px 12px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
    .modal-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; align-items:center; justify-content:center; }
    .modal-mask.show { display:flex; }
    .modal { background:#fff; border-radius:14px; width:560px; max-height:80vh; display:flex; flex-direction:column; }
    .modal .mh { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .modal .mb { padding:16px 20px; overflow-y:auto; }
    .modal .close { cursor:pointer; font-size:20px; color:var(--muted); }
    .chatline { padding:8px 12px; margin-bottom:8px; border-radius:8px; font-size:13px; line-height:1.5; }
    .chatline.user { background:#eef2ff; }
    .chatline.assistant { background:#f3f4f6; }
    .chatline.agent { background:#ecfdf5; }
    .chatline .who { font-weight:600; font-size:11px; color:var(--muted); display:block; margin-bottom:3px; }
    .reply-row { display:flex; gap:8px; margin-top:12px; }
    .reply-row input { flex:1; padding:8px 12px; border:1px solid var(--line); border-radius:8px; }
    .reply-row button { padding:8px 14px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; }
    .empty { text-align:center; color:var(--muted); padding:30px; }
</style>
</head>
<body>
<div class="layout">
    <div class="sidebar">
        <div class="brand">🤖 智能客服后台</div>
        <div class="nav">
            <a data-page="dash" class="active" onclick="switchPage('dash')">📊 数据总览</a>
            <a data-page="conv" onclick="switchPage('conv')">💬 对话记录</a>
            <a data-page="ticket" onclick="switchPage('ticket')">🎫 人工工单</a>
            <a data-page="faq" onclick="switchPage('faq')">📚 FAQ 知识库</a>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <div><h2 id="pageTitle">数据总览</h2><div class="sub">智能客服 Agent 运营数据面板</div></div>
            <span class="badge"><span class="dot" style="display:inline-block;width:7px;height:7px;background:#10b981;border-radius:50%"></span> 系统运行中</span>
        </div>

        <!-- 数据总览 -->
        <div class="page active" id="page-dash">
            <div class="cards" id="overviewCards"></div>
            <div class="grid2">
                <div class="panel"><h3>意图分布</h3><div id="intentBars"></div></div>
                <div class="panel"><h3>满意度分布（1-5 星）</h3><div class="stars-dist" id="ratingBars"></div></div>
            </div>
            <div class="grid2">
                <div class="panel"><h3>近 7 天会话趋势</h3><div class="spark" id="trendBars"></div></div>
                <div class="panel"><h3>回复来源分布</h3><div id="sourceBars"></div></div>
            </div>
        </div>

        <!-- 对话记录 -->
        <div class="page" id="page-conv">
            <div class="toolbar">
                <input id="convKeyword" placeholder="搜索会话ID / 用户" onkeydown="if(event.key=='Enter')loadConvs()">
                <select id="convStatus"><option value="">全部状态</option><option value="1">进行中</option><option value="2">已转人工</option><option value="3">已结束</option></select>
                <button onclick="loadConvs()">搜索</button>
            </div>
            <div class="panel" style="padding:0;overflow:hidden">
                <table><thead><tr><th>会话ID</th><th>用户</th><th>意图</th><th>状态</th><th>消息数</th><th>评分</th><th>时间</th><th>操作</th></tr></thead>
                <tbody id="convBody"></tbody></table>
                <div class="pager"><button onclick="convPageChange(-1)">上一页</button><span id="convPageInfo"></span><button onclick="convPageChange(1)">下一页</button></div>
            </div>
        </div>

        <!-- 人工工单 -->
        <div class="page" id="page-ticket">
            <div class="toolbar">
                <select id="ticketStatus"><option value="">全部</option><option value="0">待处理</option><option value="1">处理中</option><option value="2">已完成</option></select>
                <button onclick="loadTickets()">筛选</button>
            </div>
            <div class="panel" style="padding:0;overflow:hidden">
                <table><thead><tr><th>工单号</th><th>会话ID</th><th>问题</th><th>原因</th><th>意图</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
                <tbody id="ticketBody"></tbody></table>
            </div>
        </div>

        <!-- FAQ -->
        <div class="page" id="page-faq">
            <div class="panel" style="padding:0;overflow:hidden">
                <table><thead><tr><th>ID</th><th>问题</th><th>分类</th><th>意图</th><th>命中次数</th><th>状态</th></tr></thead>
                <tbody id="faqBody"></tbody></table>
            </div>
        </div>
    </div>
</div>

<!-- 会话详情弹窗 -->
<div class="modal-mask" id="convModal">
    <div class="modal">
        <div class="mh"><span>会话详情 <span id="modalSid" style="color:#6b7280;font-size:12px"></span></span><span class="close" onclick="closeModal('convModal')">×</span></div>
        <div class="mb" id="modalMsgs"></div>
    </div>
</div>
<!-- 工单回复弹窗 -->
<div class="modal-mask" id="ticketModal">
    <div class="modal">
        <div class="mh"><span>处理工单 <span id="modalTno" style="color:#6b7280;font-size:12px"></span></span><span class="close" onclick="closeModal('ticketModal')">×</span></div>
        <div class="mb">
            <div id="ticketQ" style="background:#f3f4f6;padding:12px;border-radius:8px;margin-bottom:12px;line-height:1.5"></div>
            <div class="reply-row"><input id="replyInput" placeholder="输入人工回复内容..."><button onclick="submitTicketReply()">提交回复</button></div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
var convPage = 1, currentTicketId = 0;
var pageTitles = { dash:'数据总览', conv:'对话记录', ticket:'人工工单', faq:'FAQ 知识库' };
function switchPage(p) {
    document.querySelectorAll('.page').forEach(function(el){el.classList.remove('active');});
    document.getElementById('page-'+p).classList.add('active');
    document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('active', a.dataset.page===p);});
    document.getElementById('pageTitle').textContent = pageTitles[p];
    if (p==='dash') loadDashboard();
    if (p==='conv') loadConvs();
    if (p==='ticket') loadTickets();
    if (p==='faq') loadFaqs();
}
function api(path, options){ options=options||{}; options.admin=true; return csApi(path, options); }

function loadDashboard() {
    api('/admin/overview').then(function(r){
        if(r.code!==0) return;
        var o=r.overview;
        var cards=[
            {label:'总会话数',value:o.total_sessions,icon:'💬',hint:'累计对话会话'},
            {label:'总消息数',value:o.total_messages,icon:'✉️',hint:'累计交互消息'},
            {label:'转人工率',value:o.transfer_rate+'%',icon:'🎫',hint:'转人工 '+o.transferred+' 次'},
            {label:'平均评分',value:o.avg_rating||'-',icon:'⭐',hint:o.rating_count+' 人评价'},
            {label:'满意度',value:o.satisfaction_rate+'%',icon:'😊',hint:'4-5星占比'},
            {label:'待处理工单',value:o.pending_tickets,icon:'⏳',hint:'需人工跟进'}
        ];
        document.getElementById('overviewCards').innerHTML=cards.map(function(c){
            return '<div class="card"><span class="icon">'+c.icon+'</span><div class="label">'+c.label+'</div><div class="value">'+c.value+'</div><div class="hint">'+c.hint+'</div></div>';
        }).join('');
        renderBars('intentBars', r.intents);
        renderBars('sourceBars', r.sources);
        renderRating(r.ratings);
        renderTrend(r.trend);
    });
}
function renderBars(id, obj) {
    var entries=Object.entries(obj); var max=Math.max(1,...entries.map(function(e){return e[1];}));
    var labels={refund:'退款',order_query:'查询订单',tech_support:'技术支持',other:'其他',faq:'知识库',llm:'AI生成',agent:'人工'};
    document.getElementById(id).innerHTML = entries.length ? entries.map(function(e){
        return '<div class="bar-row"><span class="name">'+(labels[e[0]]||e[0])+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(e[1]/max*100)+'%">'+e[1]+'</div></div></div>';
    }).join('') : '<div class="empty">暂无数据</div>';
}
function renderRating(obj) {
    var max=Math.max(1,...Object.values(obj));
    document.getElementById('ratingBars').innerHTML=[5,4,3,2,1].map(function(s){
        var c=obj[s]||0;
        return '<div class="star-col"><div class="star-bar" style="height:'+(c/max*110)+'px"></div><div class="lbl">'+s+'★ ('+c+')</div></div>';
    }).join('');
}
function renderTrend(arr) {
    var max=Math.max(1,...arr.map(function(x){return x.count;}));
    document.getElementById('trendBars').innerHTML=arr.map(function(x){
        return '<div class="col"><div class="b" style="height:'+(x.count/max*110)+'px" title="'+x.count+'"></div><div class="d">'+x.date.slice(5)+'</div></div>';
    }).join('');
}

function loadConvs() {
    var kw=encodeURIComponent(document.getElementById('convKeyword').value||'');
    var st=document.getElementById('convStatus').value;
    api('/admin/conversations?page='+convPage+'&size=15&status='+st+'&keyword='+kw).then(function(r){
        if(r.code!==0)return; var d=r.data;
        document.getElementById('convBody').innerHTML=d.list.length?d.list.map(function(c){
            return '<tr><td style="font-family:monospace;font-size:12px">'+c.session_id+'</td><td>'+esc(c.user_name)+'</td><td><span class="intent-tag">'+c.intent_text+'</span></td><td><span class="status s'+c.status+'">'+c.status_text+'</span></td><td>'+c.msg_count+'</td><td>'+(c.rating?c.rating+'★':'-')+'</td><td>'+c.created_at+'</td><td><span class="link" onclick="openConv(\''+c.session_id+'\')">查看</span></td></tr>';
        }).join(''):'<tr><td colspan="8" class="empty">暂无数据</td></tr>';
        document.getElementById('convPageInfo').textContent='第 '+d.page+' 页 / 共 '+Math.max(1,Math.ceil(d.total/d.size))+' 页 ('+d.total+' 条)';
    });
}
function convPageChange(d){ convPage=Math.max(1,convPage+d); loadConvs(); }
function openConv(sid) {
    document.getElementById('modalSid').textContent=sid;
    api('/admin/conversation?session_id='+encodeURIComponent(sid)).then(function(r){
        if(r.code!==0)return; var d=r.data;
        var html=d.messages.map(function(m){
            var who={user:'👤 用户',assistant:'🤖 小智',agent:'🎫 人工',system:'⚙️ 系统'}[m.role]||m.role;
            return '<div class="chatline '+m.role+'"><span class="who">'+who+' · '+m.created_at+'</span>'+esc(m.content)+'</div>';
        }).join('');
        if(d.tickets&&d.tickets.length){ html+='<div style="margin-top:12px;padding:10px;background:#fffbeb;border-radius:8px;font-size:12px"><b>关联工单：</b>'+d.tickets.map(function(t){return t.ticket_no+' ('+t.status_text+')';}).join('、')+'</div>'; }
        document.getElementById('modalMsgs').innerHTML=html||'<div class="empty">无消息</div>';
        document.getElementById('convModal').classList.add('show');
    });
}

function loadTickets() {
    var st=document.getElementById('ticketStatus').value;
    api('/admin/tickets?status='+st).then(function(r){
        if(r.code!==0)return; var d=r.data;
        document.getElementById('ticketBody').innerHTML=d.list.length?d.list.map(function(t){
            var act=t.status===2?'-':'<span class="link" onclick="openTicket('+t.id+',\''+esc(t.ticket_no)+'\',\''+esc(t.user_question.replace(/'/g,""))+'\')">处理</span>';
            return '<tr><td style="font-family:monospace;font-size:12px">'+t.ticket_no+'</td><td style="font-size:12px">'+t.session_id+'</td><td>'+esc(t.user_question)+'</td><td>'+esc(t.reason)+'</td><td><span class="intent-tag">'+t.intent_text+'</span></td><td><span class="status s'+(t.status===2?3:t.status+1)+'">'+t.status_text+'</span></td><td>'+t.created_at+'</td><td>'+act+'</td></tr>';
        }).join(''):'<tr><td colspan="8" class="empty">暂无工单</td></tr>';
    });
}
function openTicket(id,tno,q){ currentTicketId=id; document.getElementById('modalTno').textContent=tno; document.getElementById('ticketQ').textContent='用户问题：'+q; document.getElementById('replyInput').value=''; document.getElementById('ticketModal').classList.add('show'); }
function submitTicketReply(){
    var reply=document.getElementById('replyInput').value.trim();
    if(!reply){alert('请输入回复内容');return;}
    api('/admin/ticket/reply',{method:'POST',body:{id:currentTicketId,reply:reply,assignee:'客服-小明'}}).then(function(r){
        if(r.code===0){ closeModal('ticketModal'); loadTickets(); alert('工单已处理完成'); }
    });
}

function loadFaqs() {
    api('/admin/faqs').then(function(r){
        if(r.code!==0)return;
        document.getElementById('faqBody').innerHTML=r.data.map(function(f){
            return '<tr><td>'+f.id+'</td><td>'+esc(f.question)+'</td><td>'+f.category+'</td><td><span class="intent-tag">'+f.intent+'</span></td><td>'+f.hit_count+'</td><td><span class="status '+(f.status? 's3':'s2')+'">'+(f.status?'启用':'停用')+'</span></td></tr>';
        }).join('');
    });
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
loadDashboard();
</script>
</body>
</html>
