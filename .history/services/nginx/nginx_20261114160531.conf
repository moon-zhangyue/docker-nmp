
# 指定运行Nginx的用户和用户组
user  nginx;
# 指定Nginx要开启的进程数，通常设置为CPU核心数
worker_processes  1;

# 指定Nginx运行时的PID文件存放路径
pid        /var/run/nginx.pid;
# 指定Nginx的错误日志存放路径和日志级别
error_log  /var/log/nginx/nginx.error.log warn;

# 定义事件处理相关配置
events {
    # 定义每个worker进程的最大连接数
    worker_connections  1024;
}


# 定义HTTP服务器相关配置
http {
    # 包含MIME类型定义文件
    include       /etc/nginx/mime.types;
    # 默认的MIME类型
    default_type  application/octet-stream;

    # 定义主要的日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 禁用访问日志输出到文件（输出到/dev/null相当于不记录）
    access_log /dev/null;
    # 注释掉的配置，表示将访问日志输出到指定文件并使用main格式
    #access_log  /var/log/dnmp/nginx.access.log  main;

    # show version string for debugging
    server_tokens  on;
    sendfile        on;
    #tcp_nopush     on;
    client_max_body_size 100M;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
