# 配置 Http 代理
upstream workerman {
    server 127.0.0.1:8181;
    keepalive 10240;
}

server {
    # 监听端口
    listen 80;
    # 绑定的域名，填写您的域名
    server_name workerman.local;
    root /www/workerman/;
    index index.php index.html index.htm;

    error_log /var/log/nginx/nginx.workerman.error.log warn;

    location / {
        # 将客户端的 Host 和 IP 信息一并转发到对应节点
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 转发Cookie，设置 SameSite
        proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";

        # 执行代理访问真实服务器
        proxy_pass http://php85:2345;
    }
}

upstream webman {
    server 127.0.0.1:8787;
    keepalive 10240;
}

server {
    # 监听端口
    listen 80;
    # 绑定的域名，填写您的域名
    server_name webman.local;
    # 注意，这里一定是webman下的public目录，不能是webman根目录
    root /www/webman/public;
    index index.php index.html index.htm;

    error_log /var/log/nginx/nginx.webman.error.log warn;

    location / {
        # 将客户端的 Host 和 IP 信息一并转发到对应节点
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 转发Cookie，设置 SameSite
        proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";

        # 执行代理访问真实服务器
        proxy_pass http://php85:8787;
    }
}