
# 指定运行Nginx的用户和用户组
user  nginx;
# 指定Nginx要开启的进程数
# P1-2.1：原为 1，多核机器上其余 CPU 完全闲置。
# Docker 下不要无脑用 auto：nginx 读的是宿主机 CPU 数、不感知 cgroup 配额，
# 12 核开发机会直接拉起 12 个 worker；这里显式给小值，生产用 auto 时请同时给 compose 加 cpus 限制。
worker_processes  2;
# P1-2.1：放宽 fd 上限，否则 worker_connections 开大会被系统限制卡住
worker_rlimit_nofile 65535;

# 指定Nginx运行时的PID文件存放路径
pid        /var/run/nginx.pid;
# 指定Nginx的错误日志存放路径和日志级别
error_log  /var/log/nginx/nginx.error.log warn;

# 定义事件处理相关配置
events {
    # P1-2.1：原 1024。代理请求占 2 个 fd（客户端 + 上游），实际并发约为一半
    worker_connections  8192;
    multi_accept on;
    # use epoll;                # Linux 下 nginx 会自动选，可省略
}


# 定义HTTP服务器相关配置
http {
    # 包含MIME类型定义文件
    include       /etc/nginx/mime.types;
    # 默认的MIME类型
    default_type  application/octet-stream;

    # 定义主要的日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 禁用访问日志输出到文件（输出到/dev/null相当于不记录）
    access_log /dev/null;
    # 注释掉的配置，表示将访问日志输出到指定文件并使用main格式
    #access_log  /var/log/dnmp/nginx.access.log  main;

    # show version string for debugging
    server_tokens  on;
    sendfile        on;
    # P1-2.2：sendfile 下配合 tcp_nopush，攒满一个 TCP 包再发
    tcp_nopush     on;

    # P1-2.8：请求体上限与缓冲/超时
    # 原 100M 与 php 的 post_max_size=100M 恰好卡在边界（multipart 还有额外开销），留出余量
# 设置客户端请求体的最大大小为128M
    client_max_body_size    128M; # 设置用于存储客户端请求体的缓冲区大小为256k
    client_body_buffer_size 256k; # 设置读取客户端请求头超时时间为10秒
    client_header_timeout   10s;  # 设置读取客户端请求体超时时间为30秒
    client_body_timeout     30s;  # 设置发送响应给客户端的超时时间为30秒
    send_timeout            30s;

    keepalive_timeout  65;

    # P1-2.2：gzip（原为注释）。gzip_types 默认只含 text/html，必须显式列出其他类型
    gzip              on;# 启用vary头，告诉代理缓存服务器根据Accept-Encoding头进行缓存
    gzip_vary         on;
# 设置gzip压缩级别，1-9，9为最高压缩率，但消耗更多CPU资源
    gzip_comp_level   5;
# 设置触发压缩的最小文件大小，单位为字节，小于此大小的文件不进行压缩
    gzip_min_length   1024;
# 对任何代理请求都启用压缩，无论请求是否来自缓存
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss application/xhtml+xml image/svg+xml;

    # P1-2.4：TLS 会话复用与协议限制
    # 注意：未加 HSTS —— 本站还有 webman.local / workerman.local / tp8.local 等纯 HTTP 站点，
    # 加 HSTS 会让浏览器强制走 HTTPS，这些站点会直接不可用。
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    # 报告的原始建议是 off，但 TLS1.3 的会话复用只能靠 ticket（没有 session id），
    # off 会让 2.4 的"减少握手"目标在 TLS1.3 下完全失效（实测 -reconnect 全部为 New）。
    # 本地开发保留 on 以真正获得复用；生产若因前向安全/合规要求关闭，需接受 TLS1.3 无复用。
    ssl_session_tickets       on;

    # P1-2.5：文件元数据缓存，减少每个 PHP 请求上 try_files 的 stat 开销
    # 注意：open_file_cache_errors on 会缓存 404 最长 60s，新建文件后可能短暂 404，可调小 valid
    open_file_cache          max=4096 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # 包含所有在 /etc/nginx/conf.d/ 目录下的 .conf 配置文件
    include /etc/nginx/conf.d/*.conf;
}
